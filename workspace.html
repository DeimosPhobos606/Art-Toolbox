<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Art Toolbox 0.2</title><link rel="stylesheet" href="app/style.css"></head><body><header><strong>ART TOOLBOX <small>0.2</small></strong><nav><button data-tab="library">Asset Library</button><button data-tab="palette">Palette Lab</button><button data-tab="baker">Texture Baker</button><button data-tab="material">Material Lab</button></nav><span id="active">Нет ассета</span><a href="index.html" style="color:inherit;font-size:11px">Старый Toolbox</a><span id="status">Открытие хранилища…</span></header><main><section id="library"><aside><h3>Проекты</h3><button id="newProject">+ Проект</button><div id="projects"></div><h3>Ассеты</h3><button id="newAsset">+ Ассет</button><div id="assets"></div></aside><article><h1 id="assetTitle">Asset Library</h1><p id="intro">Создай проект и ассет. Загруженные ресурсы доступны во всех инструментах.</p><div class="actions"><button id="importMesh">Импорт модели OBJ / GLB</button><button id="importTexture">Импорт текстуры</button><button id="persist">Защитить локальное хранилище</button></div><input type="file" id="meshFile" accept=".obj,.glb" hidden><input type="file" id="textureFile" accept="image/png,image/jpeg,image/webp" multiple hidden><h3>Ресурсы ассета</h3><div id="resources"></div><p>Облако не подключено. Данные сохраняются в этом браузере. Не очищай данные сайта без резервной копии.</p><button id="backup">Скачать резервную копию ассета</button><button id="restore">Импорт копии</button><input type="file" id="backupFile" accept=".artasset" hidden></article></section><div id="frames" hidden></div></main><script type="module" src="app/main.js"></script></body></html>
