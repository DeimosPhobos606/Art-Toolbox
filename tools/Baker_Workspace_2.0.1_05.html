function receive(d){if(!active)return;clearTimeout(startup);try{if(d.error)throw Error(d.error);if(d.progress!==undefined){$('progress').value=d.progress;status('Запекание '+Math.round(d.progress*100)+'% · '+(d.stage|| (fallback?'совместимый режим':'фоновый режим')));}if(d.done){R=d.R;let ctx={R,pad,aa:payload.aa,neighbors:d.neighbors,valid:d.valid,paddingSource:d.paddingSource};for(let k of Object.keys(contexts))if(contexts[k].R===R&&contexts[k].pad===pad&&contexts[k].aa===payload.aa)contexts[k]=ctx;for(let k of selected){mapEngines[k]='2.0.1';raw[k]=k==='light'?(d.lightNormals||d.normal):d[k];contexts[k]=ctx;update(k,false);}show();stop();$('progress').value=1;window.saveBakeToWorkspace?.().catch(e=>status('Ошибка сохранения: '+e.message));status('Готово · '+d.usedBackend+(d.gpuError?' (GPU → CPU: '+d.gpuError+')':'')+' · '+selected.length+' карт'+' · mesh names: '+d.groupCount+' · parts: '+d.componentCount+(selected.includes('curv')?' · overlap seams: '+d.mirrorCount:'')+' · покрытие UV '+(100*d.covered/(R*R)).toFixed(1)+'%'+(d.outUV?' · пропущено треугольников вне 0–1: '+d.outUV:'')+(d.overlaps?' · ВНИМАНИЕ: '+d.overlaps+' перекрытий UV.':''));}}catch(e){stop();status('Ошибка запекания: '+e.message);}}
function local(reason){if(!active||fallback)return;fallback=true;clearTimeout(startup);if(backend)backend.terminate();backend=null;status('Совместимый режим: '+reason+' · подготовка…');const scope={cancelled:false,document,postMessage:d=>receive(d)};backend={terminate(){scope.cancelled=true;}};try{workerMain(scope,true);setTimeout(()=>{if(active)scope.onmessage({data:payload}).catch(e=>receive({error:e.message}));},30);}catch(e){receive({error:e.message});}}
try{url=URL.createObjectURL(new Blob(['('+workerMain.toString()+')()'],{type:'text/javascript'}));backend=new Worker(url);backend.onmessage=({data})=>receive(data);backend.onerror=e=>{e.preventDefault();local(e.message||'Worker недоступен');};backend.onmessageerror=()=>local('Ошибка передачи данных');startup=setTimeout(()=>local('Нет ответа от Worker'),15000);backend.postMessage(payload);}catch(e){local(e.message);}}

function download(k){if(!raw[k])return;outputs[k].toBlob(blob=>{if(!blob)return;let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=modelName.replace(/\.[^.]+$/,'')+'_'+({normal:'WSNormal',curv:'Curvature',ao:'AO',light:'DirectLight'}[k])+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});}
$('export').onclick=()=>{update(current);download(current)};$('exportAll').onclick=()=>{for(let [k] of maps){update(k,false);download(k)}show();};$('reset').onclick=()=>{settings[current]={...defaults(),denoise:current==='ao'?5:0};controls();update(current)};$('bake').onclick=()=>bake(false);$('bakeCurrent').onclick=()=>bake(true);$('cancel').onclick=()=>{stop();status('Запекание отменено.')};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let f=$('file').files[0];if(!f)return;if(f.size>80*1024*1024)throw Error('Файл больше 80 МБ');let m=await importMesh(f,{obj,glb});changeMesh(m,f.name);}catch(e){status(e.message)}$('file').value='';};$('demo').onclick=()=>changeMesh(demoMesh(),'Demo_cube');$('b2d').onclick=()=>setPreview('2d');$('b3d').onclick=()=>setPreview('3d');$('resetView').onclick=resetCamera;for(let id of ['b2d','b3d','resetView'])$(id).classList.add('at-legacy-view');$('hint').textContent='ЛКМ — вращение · СКМ — перемещение · колесо — масштаб · F — фокус';const split=splitLayout(document.querySelector('main'),'baker',{columns:[{id:'left',panel:document.querySelector('main>aside'),size:220,min:155,max:440},{id:'right',panel:document.querySelector('main>aside.right'),side:'right',size:240,min:170,max:500}]});let resetLayout=document.createElement('button');resetLayout.textContent='Reset Layout';resetLayout.onclick=()=>split.reset();document.querySelector('header').append(resetLayout);window.toolLayoutReset=()=>split.reset();try{changeMesh(demoMesh(),'Demo_cube');selectMap('normal');}catch(e){status('Ошибка инициализации: '+e.message);}status('Модель готова. Нажмите «Запечь карты».');

// Persist original bake buffers and graph for editable post-processing; exported PNGs are resources.
const api=connect("baker");
if(api){
 const bar=document.createElement("div");bar.className="command";let pub=document.createElement("button"),msg=document.createElement("span");pub.textContent=api.temporary?"Передать карты в инструменты":"Сохранить карты в проект";bar.append(pub,msg);document.body.insertBefore(bar,document.querySelector("main"));
 let meshRev="",ready=false,loading=false,bakeState=null,saveTask=Promise.resolve(),initTask;
 const fail=e=>{msg.textContent="Не сохранено: "+e.message;status(e.message)};
 const fields=["res","backend","pad","aa","sameMesh","normalMode","samples","radius","aoFalloff","bias","curvSamples","curvRadius","curvFalloff","smoothInfluence","ignoreMirror","includeDisconnected","contactRadius","contactStrength",...maps.map(([k])=>"bake_"+k)];
 const readFields=()=>Object.fromEntries(fields.map(k=>[k,$(k).type==="checkbox"?$(k).checked:$(k).value]));
 const saver=debounceSave(()=>api.save({version:1,engine:"2.0.1",meshRev,mapEngines:{...mapEngines},settings:structuredClone(settings),fields:readFields(),current,preview,view:view.getState()}),fail);
 function schedule(){if(ready&&!loading)saver.schedule();}
 window.toolFlush=async()=>{await initTask;if(worker)throw Error("Запекание выполняется. Заверши или отмени его перед переключением.");await saveTask;await saver.flush();};
 async function refresh(){if(loading)return;loading=true;try{let r=api.list().find(r=>r.slot==="mesh");if(r&&r.id+":"+r.revision!==meshRev){if(worker)throw Error("Запекание выполняется");let f=fileFrom(await api.get(r.id)),m=await importMesh(f,{obj,glb});changeMesh(m,f.name);meshRev=r.id+":"+r.revision;view.setIdentity(meshRev);let saved=await api.session();if(saved.bakeState?.meshRev===meshRev&&["1.7","2.0","2.0.1"].includes(saved.engine)){let d=saved.bakeState;raw=d.raw;contexts=d.contexts;mapEngines=d.mapEngines||saved.mapEngines||Object.fromEntries(Object.keys(raw).map(k=>[k,saved.engine]));for(let [k] of maps)update(k,false);show();}}}finally{loading=false;}}
 window.toolRefresh=async()=>{await refresh();view.syncCamera();};
 const originalUpdate=update;update=function(...args){originalUpdate(...args);schedule();};
 document.addEventListener("change",schedule);document.addEventListener("pointerup",schedule);
 window.saveBakeToWorkspace=()=>{if(!ready||!meshRev)return Promise.resolve();let snapshot={meshRev,raw:{...raw},contexts:{...contexts},mapEngines:{...mapEngines}};saveTask=saveTask.catch(()=>{}).then(async()=>{await api.save({version:1,engine:"2.0.1",bakeState:snapshot});await saver.flush();msg.textContent="Исходные карты сохранены";}).catch(e=>{fail(e);throw e;});saveTask.catch(()=>{});return saveTask;};
 $("file").onchange=async()=>{try{let f=$("file").files[0];if(f){let m=await importMesh(f,{obj,glb});await api.put("mesh",f,{name:f.name,kind:"mesh"});await refresh();schedule();}}catch(e){fail(e)}$("file").value="";};
 $("demo").onclick=async()=>{if(!api.temporary){msg.textContent="В проекте используется сохранённая модель.";return;}if(worker){msg.textContent="Сначала останови запекание";return;}try{await api.demo();await refresh();schedule();}catch(e){fail(e)}};
 pub.onclick=async()=>{try{if(!meshRev)throw Error("Сначала импортируй модель");if(!Object.keys(raw).length)throw Error("Сначала запеки карты");for(let [k] of maps)if(raw[k]){update(k,false);await api.put("bake:"+k,await canvasBlob(outputs[k]),{name:({normal:"World_Normal",curv:"Curvature",ao:"AO",light:"Direct_Light"}[k])+".png",kind:"texture",meta:{engine:mapEngines[k]||"2.0.1",meshRev,settings:structuredClone(settings[k])}});}await window.saveBakeToWorkspace();msg.textContent="Карты добавлены в библиотеку";}catch(e){fail(e)}};
 const oldBake=bake;bake=function(...args){if(!ready||!meshRev){msg.textContent="Сначала импортируй модель в ассет";return;}try{window.parent.ArtToolbox?.dirty?.();}catch{}oldBake(...args);};
 initTask=(async()=>{try{let s=await api.session();if(s.version===1){if(s.settings)for(let [k] of maps)Object.assign(settings[k],s.settings[k]||{});for(let [k,v] of Object.entries(s.fields||{})){let el=$(k);if(el){if(el.type==="checkbox")el.checked=!!v;else el.value=v;}}}await refresh();if(s.current&&maps.some(m=>m[0]===s.current))selectMap(s.current);if(s.view)view.restoreState(s.view);if(s.preview)setPreview(s.preview);ready=true;}catch(e){ready=true;fail(e)}})();
}
