<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material Lab 0.1</title><link rel="stylesheet" href="../app/style.css"><style>body{overflow:hidden}header{min-height:38px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 36%;height:100%;min-height:0}.left{display:flex;flex-direction:column;min-height:0}.toolbar{display:flex;gap:5px;align-items:center;padding:6px;flex-wrap:wrap}.graph{position:relative;overflow:auto;flex:1;background:#181b20;min-height:0}.board{position:relative;width:1800px;height:1100px;background-image:radial-gradient(#3a414a 1px,transparent 1px);background-size:16px 16px}.node{position:absolute;width:188px;background:#2d323b;border:1px solid #555d69;border-radius:6px;z-index:1;padding:7px}.node h4{margin:-7px -7px 7px;padding:7px;background:#415363;border-radius:5px 5px 0 0;cursor:move;touch-action:none}.node label{display:block;font-size:11px;margin:6px 0 3px;color:#bfc6cd}.node select,.node input:not([type=color]){width:100%;min-width:0;padding:4px;background:#20242a;color:inherit;border:1px solid #545c68;border-radius:4px}.node button{padding:3px 6px;margin-top:6px;font-size:11px}.node.out h4{background:#446c60}.view{display:flex;flex-direction:column;min-height:0;background:#22262b;border-left:1px solid #444}.screen{flex:1;min-height:0;position:relative;background:repeating-conic-gradient(#292d32 0% 25%,#202329 0% 50%) 0 0/24px 24px}.screen canvas{width:100%;height:100%;object-fit:contain;display:block}svg{position:absolute;inset:0;pointer-events:none}#msg{padding:6px;color:#b8c3bf;font-size:11px}</style></head><body><header><strong>MATERIAL LAB <small>0.1</small></strong><button id="example">Граф из карт</button><select id="size"><option>256</option><option selected>512</option><option>1024</option><option>2048</option></select><button id="save">Сохранить Albedo в проект</button><span id="msg"></span></header><main class="layout"><div class="left"><div class="toolbar"><select id="type"><option value="texture">Texture</option><option value="gradient">Gradient</option><option value="color">Color</option><option value="gradientMap">Gradient Map</option><option value="levels">Levels</option><option value="blend">Blend</option></select><button id="add">+ Node</button><small>Связи: выбирай источник во входах. Перемещение за заголовок.</small></div><div class="graph"><div class="board" id="board"><svg id="wires" width="1800" height="1100"></svg></div></div></div><div class="view"><div class="toolbar"><button id="two">2D</button><button id="three">3D</button><label><input id="lit" type="checkbox"> Lit</label><button id="reset">F / Reset</button></div><div class="screen"><canvas id="view2d"></canvas><canvas id="view3d" hidden></canvas></div></div></main><script type="module" src="../app/material.js"></script></body></html>
